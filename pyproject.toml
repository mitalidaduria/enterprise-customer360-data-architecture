[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "customer360-architecture-portfolio"
version = "0.1.0"
description = "Reproducible enterprise data architecture portfolio with synthetic data"
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=7"]
[tool.setuptools.packages.find]
where = ["src"]
